name: Generate Period Report

on:
  # 每週一 09:00 UTC（= 12:00 TRT）自動產生週報。
  # 排在日報（07:30 UTC，約 3-4 分鐘跑完）之後，確保拿到最新一天的資料。
  schedule:
    - cron: '0 9 * * 1'
  # 手動觸發仍然保留，可選 week / month / quarter / year
  workflow_dispatch:
    inputs:
      period:
        description: '報告週期'
        required: true
        type: choice
        options:
          - week
          - month
          - quarter
          - year
        default: week
      end_date:
        description: '結束日（YYYY-MM-DD，留空＝用 data/ 裡最新一天）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run generate_period_report.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # 定時觸發時沒有 inputs，預設產生 week
          PERIOD: ${{ inputs.period || 'week' }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          if [ -n "$END_DATE" ]; then
            python3 generate_period_report.py --period "$PERIOD" --end "$END_DATE"
          else
            python3 generate_period_report.py --period "$PERIOD"
          fi

      # 報告產生後重新渲染首頁，讓「08 期間報告」清單反映
      # docs/reports/_index.json 的最新內容
      - name: Re-render docs/index.html
        run: python3 render_report.py

      - name: Commit and push report
        env:
          PERIOD: ${{ inputs.period || 'week' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # render_report.py 也會順手重寫 docs/archive/，一起提交，
          # 否則 pull --rebase 會因為「有未提交的變更」失敗
          git add docs/reports/ docs/index.html docs/archive/
          git commit -m "Generate $PERIOD report" || echo "no changes"
          git pull --rebase --autostash origin main
          git push

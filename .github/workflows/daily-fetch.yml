name: Daily Turkiye Econ Data Fetch

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests feedparser borsapy

      - name: Run fetch_daily.py
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python fetch_daily.py

      - name: Fill in non-judgment fields (FX rate, funding cost, timestamp)
        run: python render_report.py

      - name: Commit and push data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html docs/archive/
          git diff --cached --quiet || git commit -m "Daily data fetch $(date -u +%Y-%m-%d)"
          git push

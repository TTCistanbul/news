name: Daily Turkiye Econ Data Fetch

on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chinese fonts (for the annual trade chart)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install requests feedparser borsapy matplotlib
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Chinese fonts (for the annual trade chart)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install matplotlib

      - name: Run render_report.py
        run: python3 render_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/images/
          git commit -m "Refresh site from template" || echo "no changes"
          git push
          
      - name: Run fetch_daily.py
        env:
          EVDS_API_KEY: ${{i4f4lz8N2RJrZeEGb2RTmP2GfWhzyuohbqcmH1zn }}
          EIA_API_KEY: ${{i4f4lz8N2RJrZeEGb2RTmP2GfWhzyuohbqcmH1zn }}
        run: python fetch_daily.py

      - name: Generate AI analysis (Gemini, fully automatic, no review step)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_analysis.py

      - name: Fill in template (rates, funding cost, AI blocks)
        run: python render_report.py
      - name: Commit and push data and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/index.html docs/archive/ docs/images/ templates/
          git commit -m "Daily data fetch $(date +%F)" || echo "no changes"
          git pull --rebase --autostash
          git push

name: Refresh Site

# 手動重新渲染首頁。改完 templates/report-template.html（例如更新組長
# 筆記）之後跑這一支，不用等隔天早上 08:30 的每日排程。
# 它只是拿現有的 data/ 重跑 render_report.py，不會呼叫 Gemini，
# 也不會產生新的分析內容。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run render_report.py
        run: python3 render_report.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          git commit -m "Refresh site from template" || echo "no changes"
          git push
